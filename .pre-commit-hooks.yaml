- id: copyright-check
  name: copyright-check
  description: "Add or update copyright headers (Python, Shell, C/C++, Rust, Go, JS/TS, Java, and more)"
  entry: copyright-check
  language: python
  files: '\.(py|pyi|sh|bash|zsh|fish|rb|yaml|yml|toml|r|pl|pm|tf|tfvars|rs|go|java|js|ts|jsx|tsx|c|cpp|cc|cxx|h|hpp|hxx|cs|swift|kt|kts|scala|dart|m|mm|groovy|gradle|proto|php|bat|cmd|html|htm|xml|svg|sql|lua|hs|lhs|elm)$'
  require_serial: true

- id: detect-secrets
  name: detect-secrets
  description: "Scan for hardcoded secrets, tokens, and credentials"
  entry: detect-secrets
  language: python
  types: [text]
- id: conventional-commit
  name: conventional-commit
  description: "Enforce Conventional Commits format on commit messages"
  entry: conventional-commit
  language: python
  stages: [commit-msg]
  pass_filenames: false

- id: ruff-check
  name: ruff-check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true

- id: ruff-format
  name: ruff format
  description: "Format python code"
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true

- id: pytest-run
  name: pytest-run
  description: "Run pytest to execute tests"
  entry: pytest-run
  language: python
  types: [python]
  pass_filenames: false

- id: coverage-check
  name: coverage-check
  description: "Check test coverage meets minimum threshold"
  entry: coverage-check
  language: python
  types: [python]
  pass_filenames: false

- id: rust-fmt
  name: rust-fmt
  description: "Format Rust code"
  entry: cargo fmt --
  language: system
  types: [rust]
  pass_filenames: false

- id: rust-clippy
  name: rust-clippy
  description: "Lint Rust code with clippy"
  entry: cargo clippy --
  language: system
  types: [rust]
  pass_filenames: false

- id: trailing-whitespace
  name: trailing-whitespace
  description: "Strip trailing whitespace from files"
  entry: trailing-whitespace
  language: python
  types: [text]

- id: end-of-file-fixer
  name: end-of-file-fixer
  description: "Ensure files end with a single newline"
  entry: end-of-file-fixer
  language: python
  types: [text]

- id: mixed-line-endings
  name: mixed-line-endings
  description: "Normalise mixed CR/LF line endings (default: LF)"
  entry: mixed-line-endings
  language: python
  types: [text]

- id: no-commit-to-branch
  name: no-commit-to-branch
  description: "Block direct commits to protected branches (default: main, master)"
  entry: no-commit-to-branch
  language: python
  pass_filenames: false
  always_run: true
