- id: copyright-check
  name: copyright-check
  entry: copyright-check
  language: python
  types: [python]
  require_serial: true

- id: copyright-check-rust
  name: copyright-check-rust
  entry: copyright-rust
  language: python
  types: [rust]
  require_serial: true

- id: ruff-check
  name: ruff-check
  description: "Run 'ruff check' for extremely fast Python linting"
  entry: ruff check --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true

- id: ruff-format
  name: ruff format
  description: "Format python code"
  entry: ruff format --force-exclude
  language: python
  types_or: [python, pyi, jupyter]
  require_serial: true

- id: pytest-run
  name: pytest-run
  description: "Run pytest to execute tests"
  entry: pytest-run
  language: python
  types: [python]
  pass_filenames: false

- id: coverage-check
  name: coverage-check
  description: "Check test coverage meets minimum threshold"
  entry: coverage-check
  language: python
  types: [python]
  pass_filenames: false

- id: rust-fmt
  name: rust-fmt
  description: "Format Rust code"
  entry: rustfmt
  language: system
  types: [rust]
  pass_filenames: false

- id: rust-clippy
  name: rust-clippy
  description: "Lint Rust code with clippy"
  entry: clippy
  language: system
  types: [rust]
  pass_filenames: false
