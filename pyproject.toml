[project]
name = "precommit-hooks"
version = "0.7.2"
requires-python = ">=3.9"
dependencies = [
    "ruff>=0.15.4",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "identify>=2.5.0",
]

[project.scripts]
copyright-check = "hooks.copyright:main"
pytest-run = "hooks.pytest:main"
coverage-check = "hooks.coverage:main"
trailing-whitespace = "hooks.trailing_whitespace:main"
end-of-file-fixer = "hooks.end_of_file:main"
mixed-line-endings = "hooks.line_endings:main"
no-commit-to-branch = "hooks.no_commit_to_branch:main"
detect-secrets = "hooks.detect_secrets:main"
gitignore-shadow-check = "hooks.gitignore_shadow:main"
conventional-commit = "hooks.conventional_commit:main"
no-em-dash = "hooks.no_em_dash:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

